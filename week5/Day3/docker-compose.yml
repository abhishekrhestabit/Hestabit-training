version: '3.8'

services:
  # The Backend Fleet
  backend:
    build: ./backend
    # NOTICE: No "ports" section! 
    # This keeps the backend hidden from the outside world (Host). as we dont't need to expose it..
    expose:
      - "3000"
    networks:
      - app-network

  # The Gatekeeper (Reverse Proxy)
  nginx:
    image: nginx:latest
    container_name: my-nginx-proxy
    ports:
      - "8080:80" # Map Host 8080 -> Container 80
    volumes:
      # Inject our custom config file into the container
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge