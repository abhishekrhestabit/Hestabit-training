events {
    worker_connections 1024;
}

http {
    # Define the groups of servers
    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:5000;
    }

    # SERVER BLOCK 1: HTTP (Port 80)
    # Redirect everyone to HTTPS
    server {
        listen 80;
        server_name localhost hestadashboard.com;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # SERVER BLOCK 2: HTTPS (Port 443)
    # Secure Traffic Handling
    server {
        listen 443 ssl;
        server_name localhost hestadashboard.com;

        # SSL Certificates (Mounted via Docker Volume)
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # 1. Route for Frontend (The UI)
        location / {
            proxy_pass http://frontend_upstream;
            
            # Standard Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 2. Route for Backend (The API)
        location /api {
            proxy_pass http://backend_upstream;

            # Pass headers ensuring backend knows it's secure
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}