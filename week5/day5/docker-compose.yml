version: '3.8'

services:
  # 1. Database Service
  mongo:
    image: mongo:latest
    container_name: hesta_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - hesta-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Backend Service
  backend:
    build: ./server
    container_name: hesta_backend
    restart: always
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/hestatrack
    depends_on:
      mongo:
        condition: service_healthy 
    networks:
      - hesta-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/goals"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # 3. Frontend Service
  frontend:
    build: ./client/next-app
    container_name: hesta_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost/api
    depends_on:
      backend:
        condition: service_healthy 
    networks:
      - hesta-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 4. Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hesta_nginx
    restart: always
    ports:
      - "8082:80"   # HTTP (Changed as per your config)
      - "443:443"   # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - hesta-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:

networks:
  hesta-net:
    driver: bridge