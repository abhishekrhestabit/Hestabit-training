version: '3.8'

services:
  # 1. Database Service
  mongo:
    image: mongo:latest
    container_name: hesta_mongo
    restart: always
    volumes:
      - mongo_data:/data/db  # Persist data here
    networks:
      - hesta-net

  # 2. Backend Service
  backend:
    build: ./server
    container_name: hesta_backend
    restart: always
    environment:
      - PORT=5000
      # Connect to 'mongo' service, not localhost
      - MONGO_URI=mongodb://mongo:27017/hestatrack
    depends_on:
      - mongo
    networks:
      - hesta-net

  # 3. Frontend Service
  frontend:
    build: ./client/next-app
    container_name: hesta_frontend
    restart: always
    environment:
      # Next.js needs to know where the API is (client-side)
      - NEXT_PUBLIC_API_URL=https://localhost/api
    depends_on:
      - backend
    networks:
      - hesta-net

  # 4. Reverse Proxy (The Entry Point)
  nginx:
    image: nginx:alpine
    container_name: hesta_nginx
    restart: always
    ports:
      - "8082:80"   # HTTP
      - "443:443" # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro # Make sure certs exist here!
    depends_on:
      - frontend
      - backend
    networks:
      - hesta-net

# Define the persistent volume
volumes:
  mongo_data:

# Define the internal network
networks:
  hesta-net:
    driver: bridge