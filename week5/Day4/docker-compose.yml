version: '3.8'

services:     
  backend:
    build: ./backend
    expose:
      - "3000"
    networks:
      - secure-net

  nginx:
    image: nginx:latest
    ports:
      - "80:81" 
      - "443:443" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - secure-net

networks:
  secure-net:
    driver: bridge